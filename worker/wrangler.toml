name = "kontraframe"
main = "worker.js"
compatibility_date = "2026-07-01"

[vars]
# The GitHub Pages origin allowed to call this worker. No trailing slash.
ALLOWED_ORIGIN = "https://emicore22.github.io"

# Where notification emails link back to. Same origin as above unless the app
# moves; without it the emails still send, just with no link.
SITE_URL = "https://emicore22.github.io"

# Sender for notification emails, e.g. "Kontraframe <notify@emifls.com>".
# Until this is set — and a sender exists below — notifications stay off and
# commenting is unaffected.
NOTIFY_FROM = "Kontraframe <notify@emifls.com>"

# Email sending goes through Resend: `wrangler secret put RESEND_API_KEY`.
# Cloudflare Email Service was the alternative, but its sending side needs a
# dashboard onboarding step that wasn't available here. To switch back, add:
#   [[send_email]]
#   name = "EMAIL"
# and sendEmail() in worker.js prefers the binding automatically.

# Secrets are NOT set here — set them with:
#   wrangler secret put DROPBOX_APP_KEY
#   wrangler secret put DROPBOX_APP_SECRET
#   wrangler secret put DROPBOX_REFRESH_TOKEN
#   wrangler secret put ADMIN_KEY
